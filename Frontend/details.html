<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - Shopno Properties</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="font-sans text-slate-800 bg-slate-50 min-h-screen">

    <nav class="bg-white/90 backdrop-blur-md shadow-sm py-4 px-6 md:px-20 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html" class="text-2xl font-extrabold text-blue-700 uppercase tracking-wide flex items-center gap-2">
            <i class="fas fa-home text-blue-600"></i> Shopno
        </a>
        <a href="index.html" class="text-slate-600 hover:text-blue-600 font-semibold transition">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </nav>

    <div id="loading" class="text-center py-32 text-blue-600 font-bold text-xl animate-pulse">
        <i class="fas fa-spinner fa-spin text-3xl mb-4 block"></i> Loading property details...
    </div>

    <div id="detailsContainer" class="max-w-5xl mx-auto py-12 px-6 hidden">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-100">
            
            <img id="detailImage" src="" alt="Property" class="w-full h-[400px] md:h-[550px] object-cover">
            
            <div class="p-8 md:p-12">
                <div class="mb-8">
                    <h1 id="detailTitle" class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-3 leading-tight"></h1>
                    <p id="detailLocation" class="text-slate-500 text-lg font-medium"></p>
                </div>

                <div class="w-full h-px bg-slate-200 mb-8"></div>

                <!-- Description Block -->
                <div id="descriptionSection" class="mb-10 hidden">
                    <h3 class="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-info-circle text-blue-500"></i> Project Overview
                    </h3>
                    <p id="detailDescription" class="text-slate-600 text-lg leading-relaxed whitespace-pre-wrap"></p>
                </div>

                <!-- Why Best Block (নতুন) -->
                <div id="whyBestSection" class="mb-10 hidden">
                    <h3 class="text-2xl font-bold text-slate-800 mb-4 border-l-4 border-amber-500 pl-4">Why This Project Is the Best?</h3>
                    <p id="detailWhyBest" class="text-slate-600 text-lg leading-relaxed whitespace-pre-wrap bg-amber-50/50 p-6 rounded-lg border border-amber-100"></p>
                </div>

                <!-- Allocation Policy Block (নতুন) -->
                <div id="allocationSection" class="mb-12 hidden">
                    <h3 class="text-2xl font-bold text-slate-800 mb-4 border-l-4 border-blue-500 pl-4">Plot Allocation Policy</h3>
                    <p id="detailAllocation" class="text-slate-600 text-lg leading-relaxed whitespace-pre-wrap bg-slate-50 p-6 rounded-lg border border-slate-200"></p>
                </div>

                <!-- Contact Agent Block -->
                <div class="bg-slate-900 text-white p-8 md:p-10 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-8 shadow-xl">
                    <div class="text-center md:text-left">
                        <h4 class="text-2xl font-bold mb-2 text-amber-500">Interested in this project?</h4>
                        <p class="text-slate-300">Contact our expert agents to schedule a visit or learn more details.</p>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                        <a href="tel:+8801710868734" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3.5 rounded-lg font-bold transition flex justify-center items-center gap-2 w-full sm:w-auto shadow-lg">
                            <i class="fas fa-phone-alt"></i> Call Now
                        </a>
                        <a href="https://wa.me/8801710868734" target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3.5 rounded-lg font-bold transition flex justify-center items-center gap-2 w-full sm:w-auto shadow-lg">
                            <i class="fab fa-whatsapp text-lg"></i> WhatsApp
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');

        if (!propertyId) {
            document.getElementById('loading').innerHTML = "❌ Invalid Property ID. <br><a href='index.html' class='text-blue-500 underline mt-4 block'>Go back home</a>";
        } else {
            fetchPropertyDetails();
        }

        async function fetchPropertyDetails() {
            try {
                const response = await fetch('http://localhost:5000/api/properties/' + propertyId);
                if (!response.ok) throw new Error('Not found');
                const property = await response.json();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('detailsContainer').classList.remove('hidden');

                document.getElementById('detailTitle').innerText = property.title || 'Untitled Project';
                
                if(property.location) {
                    document.getElementById('detailLocation').innerHTML = '<i class="fas fa-map-marker-alt text-blue-500 mr-2"></i> ' + property.location;
                }

                // ডেটা থাকলে সেকশনগুলো দেখাবে, না থাকলে হাইড থাকবে
                if(property.description) {
                    document.getElementById('descriptionSection').classList.remove('hidden');
                    document.getElementById('detailDescription').innerText = property.description;
                }
                
                if(property.whyBest) {
                    document.getElementById('whyBestSection').classList.remove('hidden');
                    document.getElementById('detailWhyBest').innerText = property.whyBest;
                }

                if(property.allocationPolicy) {
                    document.getElementById('allocationSection').classList.remove('hidden');
                    document.getElementById('detailAllocation').innerText = property.allocationPolicy;
                }

                const imageUrl = property.image ? 'http://localhost:5000/' + property.image : 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80';
                document.getElementById('detailImage').src = imageUrl;
                document.title = (property.title || 'Property') + " - Shopno Properties";

            } catch (error) {
                document.getElementById('loading').innerHTML = "❌ Error fetching details. <br><a href='index.html' class='text-blue-500 underline mt-4 block'>Go back home</a>";
            }
        }
    </script>
</body>
</html>
