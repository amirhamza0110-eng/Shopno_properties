<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopno Properties - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Form Area -->
        <div class="bg-white p-6 rounded-lg shadow-lg relative">
            <!-- ফর্মের টাইটেলটি ডাইনামিক হবে (Add নাকি Edit) -->
            <h2 id="formTitle" class="text-2xl font-bold mb-6 text-slate-800 border-b pb-2"><i class="fas fa-plus-circle text-blue-600"></i> Add New Property</h2>
            
            <form id="uploadForm" class="space-y-4">
                
                <div>
                    <label class="block text-slate-700 font-semibold mb-1">Project Name (Title)</label>
                    <input type="text" id="title" class="w-full border p-2 rounded outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-slate-700 font-semibold mb-1">Project Location</label>
                    <input type="text" id="location" class="w-full border p-2 rounded outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-slate-700 font-semibold mb-1">Short Description</label>
                    <textarea id="description" rows="2" class="w-full border p-2 rounded outline-none focus:border-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-slate-700 font-semibold mb-1">Why This Project Is the Best?</label>
                    <textarea id="whyBest" rows="3" class="w-full border p-2 rounded outline-none focus:border-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-slate-700 font-semibold mb-1">Plot Allocation Policy</label>
                    <textarea id="allocationPolicy" rows="3" class="w-full border p-2 rounded outline-none focus:border-blue-500"></textarea>
                </div>

                <div class="border-2 border-dashed border-gray-300 p-4 rounded text-center bg-gray-50">
                    <label class="block text-slate-700 font-semibold mb-2" id="imageLabel">Upload Image (Optional)</label>
                    <input type="file" id="image" accept="image/*" class="w-full">
                    <p class="text-xs text-gray-500 mt-1" id="imageHelp">Leave empty if you don't want to change the image during edit.</p>
                </div>

                <div class="flex items-center gap-2 mt-4 bg-blue-50 p-3 rounded border border-blue-100">
                    <input type="checkbox" id="isBanner" class="w-5 h-5 cursor-pointer">
                    <label for="isBanner" class="text-slate-800 font-semibold cursor-pointer">Set as Hero Banner</label>
                </div>

                <div class="flex gap-4 mt-4">
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">
                        <i class="fas fa-upload"></i> Save Property
                    </button>
                    <!-- ক্যানসেল বাটন (শুধু এডিট মোডে দেখাবে) -->
                    <button type="button" id="cancelBtn" onclick="cancelEdit()" class="hidden bg-gray-500 text-white font-bold py-3 px-6 rounded hover:bg-gray-600 transition">
                        Cancel Edit
                    </button>
                </div>
            </form>
            <div id="messageBox" class="mt-4 hidden p-3 rounded text-center font-semibold"></div>
        </div>

        <!-- Property List Area -->
        <div class="bg-white p-6 rounded-lg shadow-lg overflow-y-auto" style="max-height: 850px;">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-2"><i class="fas fa-tasks text-blue-600"></i> Manage Properties</h2>
            <div id="adminPropertyList" class="space-y-4">
                <p class="text-center text-gray-500">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://shopno-properties.onrender.com/api/properties';
        let allProperties = []; // এডিট করার সুবিধার জন্য ডেটা সেভ রাখা হচ্ছে
        let editingId = null;   // বর্তমানে কোনোটা এডিট হচ্ছে কি না তার রেকর্ড

        // ১. প্রপার্টি লিস্ট লোড করা
        async function fetchAdminProperties() {
            try {
                const response = await fetch(API_URL);
                allProperties = await response.json();
                
                const list = document.getElementById('adminPropertyList');
                list.innerHTML = '';
                
                if(allProperties.length === 0) return list.innerHTML = '<p class="text-center text-gray-500">No data found.</p>';

                allProperties.forEach(prop => {
                    const imageUrl = prop.image ? `https://shopno-properties.onrender.com${prop.image}` : 'https://via.placeholder.com/100';
                    const badge = prop.isBanner ? '<span class="bg-amber-500 text-white text-xs px-2 py-1 rounded ml-2">Banner</span>' : '';
                    
                    list.innerHTML += `
                        <div class="flex items-center justify-between bg-gray-50 p-3 rounded border border-gray-200 hover:shadow-md transition">
                            <div class="flex items-center gap-4">
                                <img src="${imageUrl}" class="w-16 h-16 object-cover rounded">
                                <div><h4 class="font-bold text-slate-800">${prop.title || 'Untitled'} ${badge}</h4></div>
                            </div>
                            <div class="flex gap-2">
                                <!-- Edit Button -->
                                <button onclick="editProperty('${prop._id}')" class="bg-blue-500 text-white px-3 py-2 rounded hover:bg-blue-600 transition" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <!-- Delete Button -->
                                <button onclick="deleteProperty('${prop._id}')" class="bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600 transition" title="Delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>`;
                });
            } catch (error) { console.error(error); }
        }

        // ২. এডিট বাটনে ক্লিক করলে ফর্মে ডেটা বসানো
        function editProperty(id) {
            const prop = allProperties.find(p => p._id === id);
            if(!prop) return;

            editingId = id; // এডিট মোড অন হলো
            
            // ফর্মে ডেটা বসিয়ে দেওয়া
            document.getElementById('title').value = prop.title || '';
            document.getElementById('location').value = prop.location || '';
            document.getElementById('description').value = prop.description || '';
            document.getElementById('whyBest').value = prop.whyBest || '';
            document.getElementById('allocationPolicy').value = prop.allocationPolicy || '';
            document.getElementById('isBanner').checked = prop.isBanner || false;

            // ডিজাইন আপডেট করা
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit text-amber-500"></i> Edit Property';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Property';
            document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-amber-600');
            document.getElementById('submitBtn').classList.replace('hover:bg-blue-700', 'hover:bg-amber-700');
            document.getElementById('cancelBtn').classList.remove('hidden'); // Cancel বাটন দেখানো
            
            window.scrollTo({ top: 0, behavior: 'smooth' }); // ফর্মের দিকে স্ক্রল করা
        }

        // ৩. এডিট মোড ক্যানসেল করা
        function cancelEdit() {
            editingId = null; // এডিট মোড অফ
            document.getElementById('uploadForm').reset();
            
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle text-blue-600"></i> Add New Property';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-upload"></i> Upload Property';
            document.getElementById('submitBtn').classList.replace('bg-amber-600', 'bg-blue-600');
            document.getElementById('submitBtn').classList.replace('hover:bg-amber-700', 'hover:bg-blue-700');
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        // ৪. ফর্ম সাবমিট করা (নতুন যোগ করা বা আপডেট করা)
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('whyBest', document.getElementById('whyBest').value);
            formData.append('allocationPolicy', document.getElementById('allocationPolicy').value);
            formData.append('isBanner', document.getElementById('isBanner').checked);
            
            const imageFile = document.getElementById('image').files[0];
            if(imageFile) formData.append('image', imageFile);

            // যদি editingId থাকে তবে PUT রিকোয়েস্ট (আপডেট), না থাকলে POST রিকোয়েস্ট (নতুন)
            const fetchUrl = editingId ? `${API_URL}/${editingId}` : API_URL;
            const fetchMethod = editingId ? 'PUT' : 'POST';

            try {
                const response = await fetch(fetchUrl, { method: fetchMethod, body: formData });
                if(response.ok) {
                    alert(editingId ? "✅ Updated successfully!" : "✅ Uploaded successfully!");
                    cancelEdit(); // ফর্ম রিসেট
                    fetchAdminProperties(); // লিস্ট আপডেট
                } else throw new Error("Operation failed");
            } catch (error) { alert("❌ Error: " + error.message); }
        });

        // ৫. প্রপার্টি ডিলিট করা
        async function deleteProperty(id) {
            if(confirm("Are you sure you want to delete this property?")) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if(response.ok) fetchAdminProperties();
            }
        }

        // শুরুতেই ডেটা লোড করা
        fetchAdminProperties();
    </script>
</body>
</html>
